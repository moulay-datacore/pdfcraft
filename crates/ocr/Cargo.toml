[package]
name = "pdfcraft-ocr"
description = "Scan & OCR: recognise text in page images (ocrs) and write it as an invisible, searchable text layer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-fonts = { workspace = true }
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
# `onnx_format` loads the PP-OCR recognition model as PaddlePaddle publishes it (an ONNX file),
# unchanged; `rten_format` loads ocrs's models.
rten = { version = "0.26.0", default-features = false, features = ["rten_format", "onnx_format"] }
# The same versions ocrs uses, so its detection boxes and tensors are these crates' types.
rten-imageproc = "0.26.0"
rten-tensor = "0.26.0"
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# Renders the synthetic accented pages the model-gated tests read (L3, below this crate).
pdfcraft-render = { workspace = true }
